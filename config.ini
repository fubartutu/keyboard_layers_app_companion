[KEYBOARD_USB_HID]
# Refer to https://docs.qmk.fm/features/rawhid#basic-configuration
usage_page = 0xFF60
usage = 0x61
# Only use the keyboard with this product name (the Charybdis's CONFIG_ZMK_KEYBOARD_NAME),
# so other keyboards with a raw HID interface (e.g. a Lofree Flow2) are ignored
product = XI-MK1_2

[KEYBOARD_BLE_HID]
# Refer to https://docs.qmk.fm/porting_your_keyboard_to_qmk#hardware-configuration 
vendor_id = 0x1D50
product_id = 0x615E

[KEYMAP]
# ZMK keymap to draw live (layers + pressed keys). Comment out to use the layer images below.
path = ~/Work/zmk-charybdis/config/charybdis.keymap
# Read the keymap from this git branch instead of the checked-out file, so the page matches
# the flashed firmware while you work on another branch. Remove the line to follow the working tree.
ref = main

[LAYER_IMAGES]
# Image files location: ./assets/ 
# More layers can be added by incrementing the layer number
# Example: layer_10 = my-custom-layer.png
layer_0 = miryoku-kle-base.png
layer_1 = miryoku-kle-nav.png
layer_2 = miryoku-kle-mouse.png
layer_3 = miryoku-kle-media.png
layer_4 = miryoku-kle-num.png
layer_5 = miryoku-kle-sym.png
layer_6 = miryoku-kle-fun.png
# Fallback image
layer_7 = virtual_keyboard.png
